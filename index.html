'use strict';
const CASES = [{"id":"01","title":"Anonymný signál","deck":"Kto hovorí pravdu?","tag":"Základy ESG a dôkazov","symbol":"◈","color":"#E5B475","token":"DÔVERA","lead":"O 90 minút zasadne mimoriadny etický výbor spoločnosti NORDEN Works. Na internú linku prišiel anonymný odkaz: „Ľudia sa boja hovoriť. Zmeny sa skracujú na papieri, nie v skutočnosti.“ Vedenie tvrdí, že ide o pomstu nespokojného zamestnanca.","lesson":["ESG znamená environmentálne, sociálne a riadiace faktory (Environment, Social, Governance). V tejto misii skúmame najmä S: ako firma zaobchádza so zamestnancami a s ľuďmi, ktorých ovplyvňuje.","Medzi základné práva pri práci podľa Medzinárodnej organizácie práce patria sloboda združovania a kolektívneho vyjednávania, odstránenie nútenej a detskej práce, odstránenie diskriminácie a bezpečné a zdravé pracovné prostredie.","Vyšetrovateľ musí oddeliť tvrdenie, pozorovanie a potvrdený záver. Anonymné oznámenie je dôvod vec preveriť, nie automatický dôkaz viny. Etické vyšetrovanie chráni súkromie všetkých strán a porovnáva viac nezávislých podkladov."],"terms":[["ESG","Prístup k hodnoteniu vplyvov, rizík a riadenia firmy v oblastiach E, S a G."],["Oznamovateľ","Osoba, ktorá upozorní na možné nekalé alebo protiprávne konanie."],["Dôkaz","Informácia, ktorá pomáha nezávisle preveriť určité tvrdenie."]],"evidence":[["E-mail E-01","Anonymné oznámenie","„V hale B je šichta dlhšia než vo výkaze. Prosím, neuvádzajte moje meno; bojím sa následkov.“"],["Vyjadrenie vedenia","Interná odpoveď","„Každý je spokojný. Podnet pochádza od človeka, ktorý má konflikt s nadriadeným.“"],["Záznam z porady","Zápis HR oddelenia","V poslednom mesiaci prišli tri otázky o evidencii zmien. Zatiaľ sa sťažnosti systematicky neporovnávali s dochádzkou."]],"questions":[{"phase":0,"type":"single","prompt":"Ktorá súčasť ESG rieši pracovné podmienky a ľudské práva?","options":[{"id":"a","text":"E – environmentálna"},{"id":"b","text":"S – sociálna"},{"id":"c","text":"G – riadenie firmy"},{"id":"d","text":"Ani jedna"}],"answer":["b"],"why":"Pracovné podmienky, rovnaké príležitosti a ľudské práva sú najmä sociálna oblasť ESG.","unit":null},{"phase":1,"type":"single","prompt":"Čo možno z anonymného e-mailu bezpečne vyvodiť?","options":[{"id":"a","text":"Firma už preukázateľne porušila zákon."},{"id":"b","text":"Oznamovateľ určite klame."},{"id":"c","text":"Existuje podozrenie, ktoré treba nezávisle preveriť."},{"id":"d","text":"Vedenie musí okamžite prepustiť nadriadeného."}],"answer":["c"],"why":"Oznam je signál na preverenie. Sám osebe nepreukazuje ani vinu, ani nepravdivosť.","unit":null},{"phase":1,"type":"multi","prompt":"Ktoré TRI podklady pomôžu podozrenie preveriť?","options":[{"id":"a","text":"Dochádzkové a plánovacie záznamy."},{"id":"b","text":"Dôverné rozhovory s viacerými zamestnancami."},{"id":"c","text":"Interné pravidlá a mzdové výkazy."},{"id":"d","text":"Samotné tvrdenie, že firma má dobrú reputáciu."}],"answer":["a","b","c"],"why":"Triangulácia kombinuje záznamy, rozhovory a pravidlá. Reputácia nie je dôkazom správnosti dochádzky.","unit":null},{"phase":2,"type":"single","prompt":"Ako má zodpovedný HR vyšetrovateľ začať?","options":[{"id":"a","text":"Zverejní celé oznámenie vrátane možnej identity autora."},{"id":"b","text":"Zorganizuje nestranné preverenie a minimalizuje prístup k citlivým údajom."},{"id":"c","text":"Pošle obvinenému manažérovi mená sťažovateľov."},{"id":"d","text":"Zastaví vyšetrovanie, lebo oznámenie bolo anonymné."}],"answer":["b"],"why":"Prvou povinnosťou je nestranné a dôverné preverenie s primeraným prístupom k informáciám.","unit":null}],"reflection":"Zostavte krátky plán prvých troch krokov vyšetrovania. Čo by ste si overili a ako by ste chránili ľudí, ktorí poskytli informácie?","learning":"Oznam nie je rozsudok. Etické vyšetrovanie začína overiteľnými informáciami a ochranou ľudí."},{"id":"02","title":"Stratené hodiny","deck":"Dve verzie jednej zmeny","tag":"Pracovný čas a odpočinok","symbol":"◷","color":"#7DD4E9","token":"ČAS","lead":"V hale B pracuje Mária. Podľa dochádzkového terminálu začala o 06:30 a skončila o 17:00; prestávka trvala 30 minút. V mesačnom výkaze je za daný deň zapísaných len 8 odpracovaných hodín. Nadriadený hovorí, že systém „občas zaokrúhľuje“.","lesson":["Pracovné podmienky zahŕňajú evidenciu pracovného času, odpočinok, prestávky, odmeňovanie a možnosť zosúladiť prácu so súkromným životom. Nejde len o počet odpracovaných hodín: dôležitá je pravdivá evidencia a primerané rozvrhnutie práce.","Na Slovensku je pri bežnom pracovnom režime týždenný pracovný čas najviac 40 hodín; konkrétne pravidlá závisia od režimu a platnej právnej úpravy. Pri práci dlhšej ako šesť hodín sa spravidla poskytuje prestávka na odpočinok a jedenie v trvaní 30 minút, ktorá sa zvyčajne nezapočítava do pracovného času.","Rozdiel medzi skutočne odpracovaným časom a záznamom je varovný signál. Pri závere treba preveriť aj to, či ide o prestávku, presčas, chybu evidencie alebo iný pracovný režim; jeden záznam nemusí dokazovať úmysel."],"terms":[["Pracovný čas","Čas, v ktorom zamestnanec vykonáva prácu podľa pracovnoprávnych pravidiel."],["Odpočinok","Čas určený na regeneráciu mimo výkonu práce."],["Nesúlad evidencie","Rozdiel medzi reálnym a vykázaným priebehom práce."]],"evidence":[["Terminál T-14","Elektronický záznam","Príchod 06:30; odchod 17:00; odpočítaná prestávka 00:30. Skutočne odpracovaný čas: 10:00."],["Výkaz V-14","Mesačná dochádzka","Za rovnaký deň a osobu: 08:00 odpracovaných hodín; bez poznámky o oprave alebo ďalšej evidencii."],["Správa S-14","E-mail vedúceho","„Výkazy nechajte na osem hodín. Rozdiel vyriešime neskôr.“ Nie je priložený záznam o vykonanej oprave."]],"questions":[{"phase":0,"type":"single","prompt":"Čo je hlavný dôvod sledovať pracovný čas z pohľadu ESG?","options":[{"id":"a","text":"Len zlepšiť grafy dochádzky."},{"id":"b","text":"Overovať spravodlivé podmienky, odpočinok a odmeňovanie."},{"id":"c","text":"Oprávniť čokoľvek, ak zamestnanci súhlasia."},{"id":"d","text":"Zrušiť všetky prestávky."}],"answer":["b"],"why":"Pravdivá evidencia umožňuje kontrolovať odpočinok, odmeňovanie a riziká pre zdravie.","unit":null},{"phase":1,"type":"number","prompt":"Koľko HODÍN je rozdiel medzi skutočným odpracovaným časom a výkazom? Zadajte číslo (napr. 1,5).","options":[],"answer":["2"],"why":"Od 06:30 do 17:00 je 10,5 hodiny. Po odpočítaní 0,5 hodiny prestávky ide o 10 hodín. Výkaz uvádza 8, rozdiel je 2 hodiny.","unit":"hod."},{"phase":1,"type":"single","prompt":"Ktorý podklad je kľúčový na preverenie, či sa rozdiel aj zaplatil alebo kompenzoval?","options":[{"id":"a","text":"Fotografia budovy."},{"id":"b","text":"Mzdový výkaz a pravidlá evidencie nadčasov či náhradného voľna."},{"id":"c","text":"Reklamný leták firmy."},{"id":"d","text":"Počet sledovateľov na sociálnych sieťach."}],"answer":["b"],"why":"Mzdové údaje a pravidlá práce umožnia posúdiť odmeňovanie a prípadné vyrovnanie času.","unit":null},{"phase":2,"type":"single","prompt":"Čo je vhodné opatrenie HR po zistení rozdielu v evidencii?","options":[{"id":"a","text":"Upraviť terminál tak, aby zobrazoval len osem hodín."},{"id":"b","text":"Preveriť viac období, zabezpečiť opravu evidencie a nápravu zistených nedostatkov."},{"id":"c","text":"Pokarhať zamestnanca, že prišiel skoro."},{"id":"d","text":"Ignorovať rozdiel, keďže ho nezistila kontrola."}],"answer":["b"],"why":"Vhodná je kontrola systémovej príčiny, oprava evidencie a prípadná náprava odmeňovania a odpočinku.","unit":null}],"reflection":"Napíšte, prečo môže nepresná dochádzka poškodiť zdravie, dôveru a príjem zamestnanca. Uveďte aspoň jeden konkrétny postup HR.","learning":"Presná evidencia a odpočinok sú súčasťou férových pracovných podmienok; rozdiel v záznamoch treba preveriť."},{"id":"03","title":"Nerovnaké výplatné pásky","deck":"150 eur bez vysvetlenia","tag":"Rovnosť v odmeňovaní","symbol":"€","color":"#F7C278","token":"ROVNOSŤ","lead":"Dve kolegyne – Olena a Petra – pracujú na rovnakej pozícii operátorky kvality. Majú rovnakú prax, rovnakú hodnotiacu známku a rovnaký rozsah práce. Mesačná základná mzda Petra: 1 450 €. Olena: 1 300 €. Nie je dostupná žiadna poznámka o dôvode rozdielu.","lesson":["Princíp rovnakého zaobchádzania znamená, že rozdiely v zamestnaní nemajú stáť na neodôvodnených diskriminačných kritériách, ako je pohlavie alebo národnosť. Spravodlivé odmeňovanie súvisí aj s transparentnými a objektívnymi pravidlami.","Rozdiel v mzde sám automaticky nedokazuje diskrimináciu. Môžu existovať objektívne rozdiely v náplni práce, kvalifikácii, zodpovednosti alebo výkone. Ak sú však porovnateľné pracovné podmienky a nevie sa vysvetliť rozdiel, vzniká dôvod na dôkladné preverenie.","Pri analýze je dôležité porovnávať porovnateľné pozície a pozrieť sa na základnú mzdu, príplatky, odmeny, hodnotenia i rozhodovanie o zvýšení mzdy. Zistenia treba dokumentovať bez zbytočného zverejňovania osobných údajov."],"terms":[["Rovnaké zaobchádzanie","Prístup bez neoprávneného znevýhodňovania osôb."],["Práca rovnakej hodnoty","Práca posudzovaná podľa porovnateľných objektívnych kritérií."],["Objektívne kritériá","Preukázateľné dôvody, ako náročnosť, kvalifikácia či výkon."]],"evidence":[["Mzdový list M-22","Základná mesačná mzda","Petra: 1 450 €. Olena: 1 300 €. Rozdiel sa týka základnej mzdy, nie odmien."],["Hodnotenie H-22","Pracovné hodnotenie","Obe: 4/5. Rovnaká pozícia, prax aj pracovný čas. V databáze chýba opis dôvodu rozdielu."],["Chat C-22","Poznámka vedúceho","„Olena je tu síce rovnaký čas, ale ešte sa na to nepozerajme.“ Zápis nevysvetľuje výšku rozdielu."]],"questions":[{"phase":0,"type":"single","prompt":"Čo najpresnejšie znamená férový prístup k odmeňovaniu?","options":[{"id":"a","text":"Každý človek musí mať vždy identickú mzdu."},{"id":"b","text":"Rozdiely musia byť opreté o transparentné a objektívne kritériá."},{"id":"c","text":"Mzdu možno určiť podľa národnosti."},{"id":"d","text":"Každý rozdiel je automaticky trestný čin."}],"answer":["b"],"why":"Mzda sa môže líšiť, ak je rozdiel legitímny a podložený objektívnymi dôvodmi.","unit":null},{"phase":1,"type":"number","prompt":"Aký je rozdiel v základnej mesačnej mzde oboch zamestnankýň v EUR?","options":[],"answer":["150"],"why":"1 450 − 1 300 = 150 € mesačne.","unit":"€"},{"phase":1,"type":"single","prompt":"Aký je primeraný vyšetrovací záver z dostupných dokumentov?","options":[{"id":"a","text":"Diskriminácia je už definitívne preukázaná."},{"id":"b","text":"Rozdiel je bez významu, keďže sú obidve zamestnané."},{"id":"c","text":"Existuje nevysvetlený rozdiel a treba preveriť systém odmeňovania."},{"id":"d","text":"Olena musí okamžite podať výpoveď."}],"answer":["c"],"why":"Porovnateľné okolnosti a nezdokumentovaný rozdiel sú dôvodom na audit, nie na unáhlený právny záver.","unit":null},{"phase":2,"type":"single","prompt":"Aké je najlepšie opatrenie HR?","options":[{"id":"a","text":"Porovnať relevantné pozície, overiť kritériá a napraviť prípadnú nerovnosť."},{"id":"b","text":"Zakázať zamestnancom pýtať sa na mzdy."},{"id":"c","text":"Vymazať hodnotenia výkonu."},{"id":"d","text":"Znížiť všetkým mzdu na minimum bez analýzy."}],"answer":["a"],"why":"Dokumentované porovnanie a spravodlivá náprava pomáhajú odstrániť príčinu aj následky.","unit":null}],"reflection":"Navrhnite dve objektívne kritériá, podľa ktorých možno odôvodniť rozdiel v mzde, a jeden spôsob, ako predchádzať diskriminácii.","learning":"Nevysvetlené rozdiely v mzde sú signál na kontrolu, nie automatický rozsudok."},{"id":"04","title":"Náborová pasca","deck":"Kto smie dostať šancu?","tag":"Diskriminácia pri nábore","symbol":"⌕","color":"#E6A5C3","token":"PRÍLEŽITOSŤ","lead":"Personálne oddelenie pripravilo inzerát na pozíciu administrátora skladu. V pracovnej náplni je správa zásob, komunikácia so zákazníkmi a práca v systéme. Pracovná verzia inzerátu obsahuje vetu: „Len do 30 rokov, bez malých detí, slovenská národnosť.“","lesson":["Pri nábore sa majú používať kritériá súvisiace s výkonom práce. Predsudky o veku, rodinnom stave alebo národnosti nie sú náhradou za overovanie schopností človeka. Kandidátov možno hodnotiť podľa skúseností, odbornej spôsobilosti a relevantných jazykových zručností.","Je rozdiel medzi potrebou komunikovať v konkrétnom jazyku a všeobecnou požiadavkou na určitú národnosť. Jazykovú schopnosť možno posudzovať, ak je skutočne potrebná pre prácu; národnosť je iný pojem.","Dôležité sú aj dostupné podmienky výberu: jasný opis práce, rovnaké otázky pre porovnateľných kandidátov, primerané úpravy a záznam o tom, prečo bol vybraný konkrétny uchádzač."],"terms":[["Diskriminácia","Neoprávnené znevýhodnenie pre chránenú osobnú charakteristiku."],["Relevantné kritérium","Požiadavka preukázateľne potrebná na výkon pracovnej úlohy."],["Inkluzívny nábor","Výber zameraný na schopnosti a férové príležitosti."]],"evidence":[["Inzerát I-41","Koncept ponuky","„Administrátor skladu. Vek do 30 rokov. Slovenská národnosť. Bez malých detí.“"],["Opis práce O-41","Profil pracovného miesta","Práca s objednávkami; používanie skladového softvéru; komunikácia po slovensky so zákazníkmi."],["Zápis pohovoru Z-41","Komentár personalistu","„Kandidátka má skúsenosti a jazykové zručnosti. Ale má dve deti, to by mohol byť problém.“"]],"questions":[{"phase":0,"type":"single","prompt":"Na čom by mal byť postavený spravodlivý výber zamestnanca?","options":[{"id":"a","text":"Na osobných stereotypoch."},{"id":"b","text":"Na predpokladoch a schopnostiach relevantných pre pozíciu."},{"id":"c","text":"Na veku manažéra."},{"id":"d","text":"Na tom, odkiaľ uchádzač pochádza."}],"answer":["b"],"why":"Výber musí skúmať podmienky potrebné na výkon práce, nie neoprávnené osobné charakteristiky.","unit":null},{"phase":1,"type":"multi","prompt":"Ktoré TRI požiadavky z inzerátu sú diskriminačne problematické?","options":[{"id":"a","text":"Vek do 30 rokov."},{"id":"b","text":"Bez malých detí."},{"id":"c","text":"Slovenská národnosť."},{"id":"d","text":"Schopnosť pracovať so skladovým softvérom."}],"answer":["a","b","c"],"why":"Vek, rodinná situácia a národnosť sú v danom opise neopodstatnené; znalosť softvéru súvisí s prácou.","unit":null},{"phase":1,"type":"single","prompt":"Kedy možno požadovať jazykovú znalosť v nábore?","options":[{"id":"a","text":"Len od kandidátov slovenskej národnosti."},{"id":"b","text":"Vtedy, keď ide o primeranú a reálne potrebnú zručnosť pre úlohy."},{"id":"c","text":"Nikdy."},{"id":"d","text":"Vždy iba ako dôvod vylúčiť cudzincov."}],"answer":["b"],"why":"Férová požiadavka sa týka jazykovej kompetencie, nie národnosti.","unit":null},{"phase":2,"type":"single","prompt":"Aká oprava inzerátu je najvhodnejšia?","options":[{"id":"a","text":"Nahradiť problematické požiadavky jasným opisom úloh a zručností."},{"id":"b","text":"Presunúť vekový limit do interného e-mailu."},{"id":"c","text":"Ponechať kritériá, ale vymazať ich až po pohovoroch."},{"id":"d","text":"Zverejniť mená všetkých uchádzačov."}],"answer":["a"],"why":"Kritériá majú byť prehľadné, zdôvodniteľné a rovnaké pre porovnateľných kandidátov.","unit":null}],"reflection":"Preformulujte problematický inzerát do troch férových požiadaviek. Vysvetlite, prečo by taký výber bol spravodlivejší.","learning":"Jazyková schopnosť je zručnosť; národnosť nie je oprávnenou náhradou za meranie zručností."},{"id":"05","title":"Vypnutý alarm","deck":"Nehoda, ktorú nikto nezapísal","tag":"Bezpečnosť a ochrana zdravia","symbol":"⚠","color":"#F68A81","token":"BEZPEČIE","lead":"Na linke C sa tri razy za týždeň zastavil ochranný kryt stroja. Obsluha hlásila riziko zachytenia ruky. V systéme je len jeden zápis. Vedúci prevádzky tlačí na pokračovanie výroby: „Zajtra máme audit kvality.“","lesson":["Bezpečné a zdravé pracovné prostredie patrí medzi päť základných princípov a práv pri práci podľa ILO. BOZP nespočíva iba v podpise školenia: dôležité je zisťovať nebezpečenstvá, predchádzať úrazom a reagovať na hlásené riziká.","Takmer-nehoda je udalosť, pri ktorej mohlo dôjsť k úrazu alebo škode, ale v konkrétnom prípade sa to nestalo. Jej evidencia umožňuje nájsť príčinu skôr, ako sa stane vážny incident.","Pri bezprostrednom vážnom nebezpečenstve treba uprednostniť bezpečnosť osôb pred produkčnými cieľmi. Presný postup závisí od interných procesov a predpisov, ale ignorovať opakované hlásenia nie je primeraná reakcia."],"terms":[["BOZP","Bezpečnosť a ochrana zdravia pri práci."],["Takmer-nehoda","Udalosť, pri ktorej úraz nenastal, ale riziko bolo reálne."],["Preventívne opatrenie","Zmena, ktorá znižuje pravdepodobnosť alebo závažnosť škody."]],"evidence":[["Log L-52","Hlásenia pracovníkov","Pondelok: nefunkčný kryt. Streda: opakovaná porucha. Piatok: tretie hlásenie. Celkom 3 hlásenia."],["Register R-52","Oficiálny register incidentov","V danom týždni evidované 1 z troch hlásení. Oprava stroja bez podpisu o overení funkčnosti."],["Správa P-52","Tlak na prevádzku","„Nechajte stroj v režime výroby. Výpadok by ohrozil mesačný plán.“"]],"questions":[{"phase":0,"type":"single","prompt":"Ako ILO charakterizuje bezpečné a zdravé pracovné prostredie?","options":[{"id":"a","text":"Iba dobrovoľný firemný benefit."},{"id":"b","text":"Základný princíp a právo pri práci."},{"id":"c","text":"Otázku výlučne pre poisťovňu."},{"id":"d","text":"Marketingovú aktivitu bez obsahu."}],"answer":["b"],"why":"Od roku 2022 patrí BOZP medzi päť základných princípov a práv pri práci podľa ILO.","unit":null},{"phase":1,"type":"number","prompt":"Koľko z nahlásených troch porúch chýba v oficiálnom registri?","options":[],"answer":["2"],"why":"Tri hlásenia mínus jeden zápis = dve nezaznamenané hlásenia.","unit":"hlásenia"},{"phase":1,"type":"single","prompt":"Akú úlohu majú záznamy o takmer-nehodách?","options":[{"id":"a","text":"Pomáhajú odhaliť riziká pred skutočným úrazom."},{"id":"b","text":"Slúžia len na určenie vinníka."},{"id":"c","text":"Nie je potrebné ich preverovať."},{"id":"d","text":"Používajú sa len pri výpočte dovolenky."}],"answer":["a"],"why":"Takmer-nehody sú varovné signály, ktoré umožňujú predchádzať škodám.","unit":null},{"phase":2,"type":"single","prompt":"Ktoré rozhodnutie je pri vážnom aktuálnom riziku najzodpovednejšie?","options":[{"id":"a","text":"Uprednostniť výrobné normy pred rizikom."},{"id":"b","text":"Bezpečne zastaviť ohrozenú činnosť, preveriť príčinu a obnoviť ju až po zabezpečení ochrany."},{"id":"c","text":"Zmazať staré hlásenia."},{"id":"d","text":"Počkať, až sa niekto zraní."}],"answer":["b"],"why":"Ochrana zdravia má prioritu; treba preveriť poruchu aj systém oznamovania a opráv.","unit":null}],"reflection":"Navrhnite postup pri zistení nebezpečného stroja: kto sa má dozvedieť o riziku, čo sa má overiť a ako zabrániť opakovaniu?","learning":"Takmer-nehody sú dôležité dôkazy. Prevencia chráni život a zdravie pred termínmi výroby."},{"id":"06","title":"Umlčaný hlas","deck":"Oznámenie a následná odveta","tag":"Ochrana oznamovateľov a dôstojnosť","symbol":"◉","color":"#BAA9F4","token":"OCHRANA","lead":"Zamestnankyňa Nina upozornila na chyby v mzdovej evidencii prostredníctvom interného kanála. O týždeň ju vedúci preradil na menej výhodné zmeny a pred kolektívom povedal: „Vieme, kto nás udal.“ Nina opisuje strach a poníženie.","lesson":["Whistleblowing je upozornenie na závažné nesprávne alebo protiprávne konanie. V SR sa právna ochrana oznamovateľov protispoločenskej činnosti opiera o osobitnú právnu úpravu. Nie každá pracovná sťažnosť automaticky spĺňa všetky zákonné podmienky tejto ochrany; jej posúdenie závisí od okolností.","Odvetné konanie môže mať rôzne podoby: vyhrážky, neodôvodnené zhoršenie zmien, znevýhodnenie, nátlak či pokusy odhaliť identitu oznamovateľa. Firmy potrebujú dôveryhodné kanály, primeranú dôvernosť, nestranné preverovanie a zákaz odvety.","Dôstojnosť a psychické bezpečie sú súčasťou ľudských práv v práci. Vyšetrovateľ musí oddeliť podozrenie z odvety od potvrdeného záveru, ale môže prijať primerané ochranné opatrenia už počas preverovania."],"terms":[["Whistleblowing","Oznámenie možného závažného nesprávneho konania."],["Odveta","Nepriaznivé zaobchádzanie súvisiace s oznámením."],["Dôvernosť","Obmedzenie prístupu k identite a citlivým údajom na nevyhnutné osoby."]],"evidence":[["Potvrdenie K-61","Interný oznamovací kanál","Nina odoslala oznámenie o evidencii miezd 4. novembra. Potvrdenie o prijatí bolo automaticky doručené."],["Rozpis R-61","Zmeny po oznámení","Od 11. novembra pribudli menej výhodné zmeny. Rozpis neobsahuje písomné zdôvodnenie zmeny."],["Svedectvo S-61","Výpoveď kolegu","„Vedúci na porade povedal, že vie, kto nás udal. Nina potom prestala chodiť na tímové stretnutia.“"]],"questions":[{"phase":0,"type":"single","prompt":"Čo je účelom dôveryhodného oznamovacieho kanála?","options":[{"id":"a","text":"Zabezpečiť nestranné preverenie podnetov a primeranú ochranu ľudí."},{"id":"b","text":"Zverejniť identitu každého, kto sa sťažuje."},{"id":"c","text":"Zaviesť automatické tresty za každý podnet."},{"id":"d","text":"Nahradiť všetku prácu personalistov."}],"answer":["a"],"why":"Oznamovacie kanály majú umožniť bezpečné nahlásenie a posúdenie relevantných podnetov.","unit":null},{"phase":1,"type":"multi","prompt":"Ktoré TRI okolnosti predstavujú varovné signály možnej odvety?","options":[{"id":"a","text":"Zhoršenie zmien krátko po oznámení bez zdôvodnenia."},{"id":"b","text":"Výrok vedúceho odhaľujúci identitu oznamovateľa."},{"id":"c","text":"Vyjadrený strach a poníženie oznamovateľky."},{"id":"d","text":"Nezávislé preverenie podnetu bez zverejnenia identity."}],"answer":["a","b","c"],"why":"Časová súvislosť, zhoršenie podmienok, hrozba odhalenia identity a psychické dopady si žiadajú preverenie.","unit":null},{"phase":1,"type":"single","prompt":"Čo je pri hodnotení možnej odvety dôležité?","options":[{"id":"a","text":"Automaticky predpokladať, že vedúci je vinný."},{"id":"b","text":"Preveriť časový sled, dôvod zmien, svedectvá a dokumenty."},{"id":"c","text":"Odporučiť mlčanie bez preverenia."},{"id":"d","text":"Odstrániť pôvodné oznámenie."}],"answer":["b"],"why":"Spravodlivé vyšetrovanie stojí na časovej osi a dostupných dokumentoch.","unit":null},{"phase":2,"type":"single","prompt":"Ktoré riešenie je najvhodnejšie?","options":[{"id":"a","text":"Zverejniť meno Niny všetkým zamestnancom."},{"id":"b","text":"Poskytnúť primeranú ochranu pred ďalším znevýhodnením a nezávisle preveriť podnet aj možné odvetné kroky."},{"id":"c","text":"Ninu automaticky premiestniť do inej firmy."},{"id":"d","text":"Každú sťažnosť bez preskúmania zamietnuť."}],"answer":["b"],"why":"Treba chrániť dôvernosť, nestranne zisťovať fakty a riešiť možné odvetné konanie.","unit":null}],"reflection":"Napíšte krátku odpoveď HR Nine: ako jej vysvetlíte ďalší postup, ochranu dôvernosti a možnosti pomoci bez sľubovania výsledku vopred?","learning":"Bez dôvernosti a zákazu odvety ľudia prestávajú upozorňovať na riziká; nie každá sťažnosť však automaticky získava rovnaký zákonný režim."},{"id":"07","title":"Továreň za hranicou","deck":"Neviditeľný dodávateľ","tag":"Detská a nútená práca v reťazci","symbol":"◇","color":"#99C5A5","token":"ZODPOVEDNOSŤ","lead":"NORDEN Works nakupuje diely od dodávateľa METALIS. V správe miestnej organizácie sa spomínajú zadržiavané cestovné doklady, náborové poplatky a práca mladistvých. Obchodné oddelenie tvrdí: „Nie sú to naši zamestnanci, tak nás to nemusí zaujímať.“","lesson":["Sociálna zodpovednosť firmy nekončí pri zamestnancoch na vlastnej výplatnej listine. Riziká ľudských práv sa môžu objaviť aj v dodávateľských reťazcoch. Rámce ESG pracujú s vplyvmi na vlastnú pracovnú silu aj na pracovníkov v hodnotovom reťazci.","Medzi varovné signály nútenej práce patria napríklad obmedzovanie slobody odchodu, zadržiavanie dokladov, hrozby a nespravodlivé dlhy voči náborovým sprostredkovateľom. Pri mladistvých treba rozlišovať zákonnú primeranú prácu od zakázanej detskej či nebezpečnej práce; konkrétne právne pravidlá závisia od veku a krajiny.","Zodpovedné riešenie zahŕňa dôkladné preverenie, ochranu ohrozených ľudí, nápravu a následnú kontrolu. Okamžité ukončenie spolupráce bez plánu môže v niektorých situáciách pracovníkov ešte viac poškodiť."],"terms":[["Dodávateľský reťazec","Podniky a pracovníci podieľajúci sa na dodaní produktu alebo služby."],["Nútená práca","Práca vykonávaná nedobrovoľne pod hrozbou postihu."],["Náležitá starostlivosť","Proces zisťovania a riešenia rizík a škodlivých vplyvov."]],"evidence":[["Report D-73","Nezávislé zistenia","Rozhovory s pracovníkmi: 4 osoby hlásia zadržiavanie dokladov; 2 náborové poplatky; 1 uvádza hrozbu pri odchode."],["Audítorská karta A-73","Predbežné posúdenie","Rizikové body: zadržiavanie dokladov = áno; náborové poplatky = áno; hrozba pri odchode = áno; rôzny materinský jazyk = nie."],["List dodávateľa L-73","Stanovisko METALIS","„Všetko je dobrovoľné.“ Stanovisko neobsahuje nezávislý dôkaz ani nápravný plán."]],"questions":[{"phase":0,"type":"single","prompt":"Prečo má firma zvažovať ľudské práva aj u dodávateľov?","options":[{"id":"a","text":"Riziká sa môžu prenášať cez hodnotový reťazec."},{"id":"b","text":"Dodávatelia automaticky patria na mzdovú listinu firmy."},{"id":"c","text":"ESG sa týka iba reklamy."},{"id":"d","text":"Ak je dodávateľ ďaleko, žiadne riziko neexistuje."}],"answer":["a"],"why":"Firma má sledovať relevantné vplyvy na ľudí aj v hodnotovom reťazci.","unit":null},{"phase":1,"type":"multi","prompt":"Ktoré TRI znaky sú relevantné varovné signály nútenej práce?","options":[{"id":"a","text":"Zadržiavanie osobných dokladov."},{"id":"b","text":"Vysoké náborové poplatky vytvárajúce závislosť."},{"id":"c","text":"Hrozby pri pokuse odísť z práce."},{"id":"d","text":"Zamestnanci hovoria rôznymi jazykmi."}],"answer":["a","b","c"],"why":"Zadržiavanie dokladov, zadlženie cez nábor a hrozby sú rizikové znaky; jazyková rozmanitosť sama nie.","unit":null},{"phase":1,"type":"number","prompt":"Koľko z uvedených ŠTYROCH bodov audítorskej karty je označených ako riziko? Zadajte počet.","options":[],"answer":["3"],"why":"Tri položky sú označené „áno“; rôzny jazyk nie je rizikovým znakom nútenej práce.","unit":"riziká"},{"phase":2,"type":"single","prompt":"Čo má firma urobiť ako prvé zodpovedné opatrenie?","options":[{"id":"a","text":"Ignorovať dodávateľa, lebo zamestnanci nie sú jej vlastní."},{"id":"b","text":"Nezávisle preveriť podozrenia, chrániť pracovníkov a vyžadovať účinný plán nápravy s kontrolou."},{"id":"c","text":"Automaticky zverejniť mená pracovníkov."},{"id":"d","text":"Zmeniť len marketingové heslo o etike."}],"answer":["b"],"why":"Dôležité je preverenie, ochrana a účinná náprava, nie iba reputačné gesto.","unit":null}],"reflection":"Navrhnite, ako by sa mal HR a nákupný tím zapojiť do riešenia rizík u dodávateľa tak, aby sa nepoškodili samotní pracovníci.","learning":"Práva pracovníkov sú relevantné aj mimo priameho zamestnania; cieľom je reálna ochrana a náprava."},{"id":"08","title":"Tiché dáta","deck":"Koľko toho firma smie sledovať?","tag":"Súkromie a dôstojnosť na pracovisku","symbol":"⌘","color":"#87C7D9","token":"SÚKROMIE","lead":"V rámci „zvyšovania produktivity“ firma nainštalovala nástroj na zaznamenávanie pohybu kurzora a snímok obrazovky. Zamestnanci sa o tom dozvedeli až o mesiac. Niektoré snímky zahŕňali aj súkromné správy. Manažér argumentuje, že „firemný notebook patrí firme“.","lesson":["Právo na súkromie a dôstojnosť nekončí automaticky pri vstupe do práce. Zamestnávateľ môže v určitých situáciách používať primerané kontrolné mechanizmy, ale musí rešpektovať zákonné pravidlá, transparentnosť, účel a primeranosť spracúvania údajov.","Zber dát má byť obmedzený na údaje potrebné pre konkrétny legitímny cieľ. Princíp minimalizácie znamená, že firma nemá získavať viac osobných údajov, než je na daný účel potrebné. Dôležitá je aj primeraná doba uchovávania a prístupové oprávnenia.","Pri zistení nadmerného monitorovania je vhodné zapojiť zodpovednú osobu pre ochranu údajov alebo právne oddelenie, preveriť nastavenie nástroja a odstrániť neprimerané zásahy."],"terms":[["Súkromie","Ochrana osobnej sféry a údajov človeka."],["Minimalizácia údajov","Spracúvanie len tých údajov, ktoré sú nevyhnutné pre konkrétny účel."],["Transparentnosť","Zrozumiteľné informovanie o tom, čo a prečo sa sleduje."]],"evidence":[["Politika P-81","Interný dokument","V politike sa uvádza len evidencia prihlásenia do pracovného systému; plošné snímkovanie sa nespomína."],["Záznam Z-81","Nastavenie nástroja","Snímka každých 30 sekúnd; automatické uchovávanie bez nastavenej lehoty; prístup ôsmich vedúcich."],["Výpoveď V-81","Skúsenosť zamestnanca","„Nevedel som, že systém fotografuje obrazovku. Na snímke bola viditeľná súkromná správa.“"]],"questions":[{"phase":0,"type":"single","prompt":"Čo znamená zásada minimalizácie osobných údajov?","options":[{"id":"a","text":"Zbierať všetko, čo technológia umožňuje."},{"id":"b","text":"Zbierať iba to, čo je potrebné pre jasne určený účel."},{"id":"c","text":"Zverejniť všetky údaje vedúcim."},{"id":"d","text":"Nikdy nespracovať žiadne údaje o zamestnancoch."}],"answer":["b"],"why":"Minimalizácia vyžaduje primerané a nevyhnutné údaje vo vzťahu ku konkrétnemu účelu.","unit":null},{"phase":1,"type":"multi","prompt":"Ktoré TRI skutočnosti predstavujú riziká pre súkromie?","options":[{"id":"a","text":"Zamestnanci neboli zrozumiteľne informovaní o plošnom snímkovaní."},{"id":"b","text":"Snímky môžu zachytiť súkromnú komunikáciu."},{"id":"c","text":"Nie je určená lehota uchovávania snímok."},{"id":"d","text":"Prístupové práva k údajom sú obmedzené len na nevyhnutné osoby."}],"answer":["a","b","c"],"why":"Neinformovanosť, nadmerný zber a neurčená retencia sú významné riziká; obmedzený prístup je naopak ochranné opatrenie.","unit":null},{"phase":1,"type":"single","prompt":"Ktorá otázka musí zaznieť pred použitím monitorovacieho nástroja?","options":[{"id":"a","text":"Ako získame čo najviac záberov bez vysvetlenia?"},{"id":"b","text":"Je kontrola potrebná, primeraná, transparentná a má jasný účel?"},{"id":"c","text":"Je nástroj farebne pekný?"},{"id":"d","text":"Koľko zamestnancov možno verejne zahanbiť?"}],"answer":["b"],"why":"Legitímny účel, primeranosť a transparentnosť sú základné prvky zodpovedného monitorovania.","unit":null},{"phase":2,"type":"single","prompt":"Čo je primeraná reakcia HR?","options":[{"id":"a","text":"Tajné snímkovanie ešte rozšíriť."},{"id":"b","text":"Preveriť zákonnosť a primeranosť, upraviť zber, dobu uchovávania a informovanie zamestnancov."},{"id":"c","text":"Zverejniť všetky snímky na intranete."},{"id":"d","text":"Riešiť vec až po verejnom škandále."}],"answer":["b"],"why":"Pri nadmernom monitorovaní je potrebný audit nastavenia a primeraná náprava.","unit":null}],"reflection":"Navrhnite dve hranice, ktoré by mal zamestnávateľ rešpektovať pri digitálnom monitorovaní. Uveďte, prečo je to dôležité pre dôveru.","learning":"Vlastníctvo pracovného zariadenia samo osebe neoprávňuje neobmedzené sledovanie ľudí."},{"id":"09","title":"Zasadnutie etického výboru","deck":"Verdikt pred koncom odpočtu","tag":"Syntéza a ESG plán nápravy","symbol":"✦","color":"#E9C58D","token":"NÁPRAVA","lead":"Z deviatich oddelení sa na stôl etického výboru dostali dôkazy o nepresnej dochádzke, nevysvetlených mzdových rozdieloch, problematickom nábore, riziku úrazu, možnej odvete, rizikách dodávateľa a monitorovaní. Vedenie žiada jednoduchú odpoveď: „Je to len komunikačný problém?“","lesson":["ESG nie je iba vydanie peknej správy. Rozhodujú skutky: identifikovať riziká, určiť priority, prijať opatrenia, prideliť zodpovednosť, overiť výsledky a priebežne informovať zainteresovaných ľudí.","Nie každé podozrenie je už preukázané porušenie práva. Niektoré nálezy však vyžadujú okamžité preventívne opatrenia – najmä bezprostredné ohrozenie zdravia. Súčasne treba chrániť oznamovateľov a spravodlivo preskúmať pracovné a mzdové záznamy.","Úspešný HR plán nápravy spája krátkodobé kroky s dlhodobými procesmi. Nestačí len napísať nový etický kódex; potrebujeme merateľné zmeny, zodpovedné osoby a následnú kontrolu."],"terms":[["Nápravné opatrenie","Konkrétna zmena na odstránenie príčiny a následkov problému."],["Prioritizácia","Určenie poradia riešenia podľa závažnosti a naliehavosti."],["Zainteresovaná strana","Človek alebo skupina, ktorú rozhodovanie firmy ovplyvňuje."]],"evidence":[["Mapa rizík R-91","Zhrnutie vyšetrovania","A: nebezpečný stroj, bezprostredné riziko úrazu. B: nezdokumentované mzdové rozdiely. C: nejasné náborové kritériá. D: nedostatočné informovanie o monitorovaní."],["Správa HR H-91","Návrh opatrení","1. Bezpečnostná kontrola a náprava. 2. Audit pracovného času a miezd. 3. Ochrana oznamovateľov. 4. Audit náboru, dodávateľov a monitorovania."],["Prezentácia vedenia V-91","Pôvodný návrh","„Vydáme ESG plagát a zamestnancov požiadame o pozitívne recenzie. Tým bude problém vyriešený.“"]],"questions":[{"phase":0,"type":"single","prompt":"Čo je najlepší ukazovateľ zodpovedného ESG riadenia?","options":[{"id":"a","text":"Pekné marketingové heslo."},{"id":"b","text":"Preukázateľné opatrenia, výsledky a priebežná kontrola."},{"id":"c","text":"Počet tlačových správ."},{"id":"d","text":"Utajenie všetkých sťažností."}],"answer":["b"],"why":"Dôveryhodné ESG si vyžaduje reálne zmeny a meranie ich účinku.","unit":null},{"phase":1,"type":"single","prompt":"Ktoré riziko z mapy treba riešiť najnaliehavejšie?","options":[{"id":"a","text":"Chýbajúca grafika na plagáte."},{"id":"b","text":"Bezprostredne nebezpečný stroj."},{"id":"c","text":"Farba interného portálu."},{"id":"d","text":"Počet firemných príspevkov."}],"answer":["b"],"why":"Bezprostredné ohrozenie zdravia a života má prednosť; ostatné závažné problémy treba riešiť paralelne.","unit":null},{"phase":1,"type":"multi","prompt":"Ktoré TRI kroky patria do zodpovedného plánu?","options":[{"id":"a","text":"Nezávislé preverenie a náprava pracovného času a miezd."},{"id":"b","text":"Ochrana oznamovateľov a riešenie možnej odvety."},{"id":"c","text":"Prevencia, kontrola BOZP a systematický audit ďalších rizík."},{"id":"d","text":"Nahradiť všetky opatrenia reklamným videom."}],"answer":["a","b","c"],"why":"Dobrý plán spája preverenie, ochranu ľudí, nápravu a prevenciu; komunikácia sama nestačí.","unit":null},{"phase":2,"type":"single","prompt":"Aký záverečný verdikt najlepšie zodpovedá získaným dôkazom?","options":[{"id":"a","text":"Všetky problémy sú vyvrátené bez potreby kontroly."},{"id":"b","text":"Zistené sú viaceré vážne signály systémových nedostatkov; firma musí konať, preveriť ich a merať nápravu."},{"id":"c","text":"Stačí vymeniť logo a zmeniť názov firmy."},{"id":"d","text":"Vinu nesú automaticky všetci zamestnanci."}],"answer":["b"],"why":"Viaceré nezávislé signály odôvodňujú plán nápravy a nestranné preverenie, nie unáhlené vynášanie právnych verdiktov.","unit":null}],"reflection":"Ako člen etického výboru napíšte krátke záverečné odporúčanie: tri konkrétne opatrenia, ich priority a jeden spôsob overenia, či skutočne pomohli.","learning":"Etické ESG je dôkazmi podložená zmena pracovných podmienok, nie iba formulácia záväzkov."}];
const TEACHER_PREVIEW = false;
const PHASES = TEACHER_PREVIEW ? [1,1,1] : [120,240,240];
const SOURCE_LINKS = [["ILO – Základné zásady a práva pri práci","https://www.ilo.org/fundamental-principles-and-rights-work"],["ESRS S1 – Vlastná pracovná sila (EFRAG)","https://knowledgehub.efrag.org/eng/interactive/esrs-set-1/esrs-s1-own-workforce/2023-12-22-amended-da/disclosure-requirement-s1-10-adequate-wages"],["Úrad na ochranu oznamovateľov SR","https://www.oznamovatelia.sk/en/nase-cinnosti/ochrana-oznamovatelov/"],["EURES – Pracovné podmienky na Slovensku","https://eures.europa.eu/living-and-working/living-and-working-conditions-europe/living-and-working-conditions-slovakia_en"],["Slovensko.sk – Rovnaké zaobchádzanie","https://www.slovensko.sk/en/life-situation/life-situation/_equal-treatment"]];
const STORAGE_KEY = TEACHER_PREVIEW ? 'twb_esg_teacher_v2' : 'twb_esg_student_v2';
const MAX_POINTS = CASES.length * 5;
let state = load();
const app = document.getElementById('app');
const escapeHtml = (s)=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function fresh(){return {fullName:'',group:'',startedAt:null,completedAt:null,current:0,phase:0,phaseSeconds:0,totalSeconds:0,answers:{},drafts:{},reflections:{},evidenceOpen:{},viewed:{},earnedTokens:[]};}
function load(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY));if(data&&typeof data==='object'&&data.fullName&&Number.isInteger(data.current)&&data.current>=0&&data.current<=9){return {...fresh(),...data};}}catch(e){}return fresh();}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function fmt(s){s=Math.max(0,Math.ceil(s));let h=Math.floor(s/3600),m=Math.floor(s%3600/60),q=s%60;return (h?h.toString().padStart(2,'0')+':':'')+m.toString().padStart(2,'0')+':'+q.toString().padStart(2,'0');}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0;}
function shuffledOptions(q,qi){return [...q.options].sort((a,b)=>hash(state.fullName+state.group+state.current+qi+'|'+a.id)-hash(state.fullName+state.group+state.current+qi+'|'+b.id));}
function key(qi){return String(state.current)+'-'+String(qi)}
function answered(qi){return !!state.answers[key(qi)]}
function isViewed(i){return !!state.viewed[state.current+'-'+i]}
function score(){let core=0;for(let k in state.answers){if(state.answers[k].correct)core++}let refl=Object.values(state.reflections).filter(x=>reflectionOK(x)).length;return {core,refl,total:core+refl};}
function reflectionOK(v){return typeof v==='string' && v.trim().length>=100 && v.trim().split(/\s+/).length>=13}
function noticePrint(){return TEACHER_PREVIEW?'<div class="preview">TESTOVACIA VERZIA PRE VYUČUJÚCEHO – NEZVEREJŇOVAŤ ŠTUDENTOM. ČASOVAČE SÚ SKRÁTENÉ NA 1 SEKUNDU NA FÁZU.</div>':''}
function foot(){return `<footer class="footer"><span>© Ing. Kristína Kozová · ESG | Ľudské práva a pracovné podmienky</span><span>Fiktívny prípad NORDEN Works · Údaje sa ukladajú iba v tomto prehliadači.</span></footer>`}
function sources(){return `<details class="refdetails"><summary>Odborné zdroje a poznámka k obsahu</summary><p class="small">Všetky osoby, firmy a dokumenty v hre sú vymyslené. Hra je učebná simulácia, nie právne poradenstvo. Na posúdenie konkrétneho prípadu treba poznať aktuálne právne predpisy a všetky fakty.</p><ul>${SOURCE_LINKS.map(x=>`<li><a href="${escapeHtml(x[1])}" target="_blank" rel="noopener noreferrer">${escapeHtml(x[0])}</a></li>`).join('')}</ul></details>`}
function renderIntro(){app.innerHTML=`${noticePrint()}<header class="topbar"><div class="top-in"><div class="brand">NW<span style="color:var(--gold)">/</span> INVESTIGATIONS</div><div class="small mono">CLASSIFIED // CASE 026</div></div></header><main class="intro"><div><div class="eyebrow">Výučbová detektívna hra · ESG / S</div><h1 class="huge">THE <span>WHISTLE-</span>BLOWER</h1><p class="intro-copy">Deviatimi spismi odhalíte, čo sa skrýva za tvrdením: „Naši zamestnanci sú našou prioritou.“ V úlohe vyšetrovateľa HR rozhodnete, ktoré dôkazy stoja za pozornosť a ako majú byť chránené ľudské práva.</p><div class="intro-visual" role="img" aria-label="Utajovaný vyšetrovací spis"></div><div class="intel"><div class="eyebrow">Vaše zadanie</div><p><b>9 spisov · 3 fázy na spis · minimálne 90 aktívnych minút.</b> Každá fáza má vlastný časový zámok, otázky a ďalšie dôkazy. Čas beží len v aktívnom okne hry.</p><p>Je to samostatná vzdelávacia simulácia: učivo dostanete priamo v spisoch. Na konci uvidíte skóre a pokyny na odoslanie screenshotu cez MS Teams.</p></div></div><div class="panel signup"><div class="pill">● AUTORIZÁCIA VYŠETROVATEĽA</div><h2>Otvoriť vyšetrovací spis</h2><p>Vyplňte údaje presne. Na výslednej obrazovke sa zobrazia spolu so skóre.</p><form id="start-form"><label class="field" for="student-name">Meno a priezvisko</label><input id="student-name" class="control" placeholder="napr. Jana Nováková" maxlength="90" autocomplete="name" required><label class="field" for="student-group">Číslo krúžku</label><input id="student-group" class="control" placeholder="napr. 3" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" required><div id="start-error" class="error" aria-live="polite"></div><button class="btn primary block" type="submit">VSTÚPIŤ DO VYŠETROVANIA →</button></form><p class="note">Pri obnovení stránky sa pokračovanie obnoví z tohto prehliadača. Hra neposiela osobné údaje na server. Pre dochádzku slúži až vami odoslaný screenshot výsledku.</p><div class="notice">Dôležité: otázky môžete vyriešiť aj nesprávne. Podstatné je preskúmať dôkazy a dôjsť až k záverečnému spisu.</div></div></main>`;document.getElementById('start-form').addEventListener('submit',startGame)}
function startGame(e){e.preventDefault();const name=document.getElementById('student-name').value.trim().replace(/\s+/g,' ');const group=document.getElementById('student-group').value.trim();const err=document.getElementById('start-error');if(name.split(' ').length<2 || name.length<5){err.textContent='Zadajte celé meno aj priezvisko.';return}if(!/^[0-9]{1,2}$/.test(group)||Number(group)<1){err.textContent='Zadajte platné číslo krúžku.';return}state=fresh();state.fullName=name;state.group=group;state.startedAt=new Date().toISOString();save();render();window.scrollTo(0,0)}
function topbar(){return `${noticePrint()}<header class="topbar"><div class="top-in"><div><span class="brand">THE <b>WHISTLEBLOWER</b></span><div class="small mono">ESG / PERSONÁLNY MANAŽMENT / SPIS NW-026</div></div><div style="text-align:right"><div class="small"><b>${escapeHtml(state.fullName)}</b> · krúžok <b>${escapeHtml(state.group)}</b></div><div class="small mono">AKTÍVNY ČAS: <span id="global-clock">${fmt(state.totalSeconds)}</span></div></div></div></header>`}
function side(){return `<aside class="sidebar"><div class="head"><div class="eyebrow">Vyšetrovací protokol</div><h3>Odomknuté spisy: ${state.current}/9</h3><div class="tiny-meter"><span style="width:${Math.round(state.current/9*100)}%"></span></div><div class="small">Aktuálny spis: ${state.current+1} z 9</div><div class="small">Priebežné body: ${score().total}/${MAX_POINTS}</div></div><ol class="dossier-list">${CASES.map((c,i)=>`<li class="${i===state.current?'active':i<state.current?'done':''}"><div class="dossier-num">${i<state.current?'✓':escapeHtml(c.id)}</div><div><div class="dossier-name">${escapeHtml(c.title)}</div><small>${i<state.current?'Uzavretý spis':i===state.current?'VYŠETRUJE SA':'Zamknuté'}</small></div></li>`).join('')}</ol><div class="sidebar-foot">Nie je možné preskočiť spisy ani povinné fázy. Počas prepnutia na inú kartu sa čas pozastaví.</div></aside>`}
function phaseNav(){const labels=['01 / NAUČIŤ SA','02 / PRESKÚMAŤ','03 / ROZHODNÚŤ'];return `<nav class="phase-nav" aria-label="Fázy spisu">${labels.map((l,i)=>`<div class="phase-tab ${i===state.phase?'now':i<state.phase?'passed':''}"><span class="round">${i<state.phase?'✓':i+1}</span><strong>${l}</strong></div>`).join('')}</nav>`}
function questionHTML(q,qi){const existing=state.answers[key(qi)];const draft=state.drafts[key(qi)]||[];let control='';if(q.type==='number'){control=`<input type="number" step="0.5" min="0" class="control numeric" aria-label="Číselná odpoveď" data-draft-number="${qi}" value="${escapeHtml(existing?existing.selected[0]:(draft[0]||''))}" ${existing?'disabled':''}>`;}else{control=`<div class="answer-grid">${shuffledOptions(q,qi).map(o=>{let checked=(existing?existing.selected:draft).includes(o.id);return `<label class="option"><input type="${q.type==='multi'?'checkbox':'radio'}" ${q.type==='single'?`name="q${qi}"`:''} value="${o.id}" data-draft="${qi}" ${checked?'checked':''} ${existing?'disabled':''}><span>${escapeHtml(o.text)}</span></label>`}).join('')}</div>`;}return `<article class="qcard"><div class="q-title"><h3>${escapeHtml(q.prompt)}</h3><span class="points">1 BOD</span></div>${q.type==='multi'?'<p class="source-flag">Viac správnych možností – označte všetky vyhovujúce odpovede.</p>':''}${control}${existing?`<div class="feedback ${existing.correct?'':'bad'}"><b>${existing.correct?'✓ Správne · +1 bod':'○ Nesprávne · 0 bodov'}</b><p>${escapeHtml(q.why)}</p></div>`:`<button class="btn secondary q-submit" type="button" data-action="submit-answer" data-qi="${qi}">Uložiť odpoveď a zobraziť vysvetlenie</button>`}</article>`}
function casePhaseContent(c){if(state.phase===0){return `<section class="section"><div class="eyebrow">VZDELÁVACÍ BRÍFING · SPIS ${c.id}</div><h2>Najskôr pochopte súvislosti</h2><p class="case-lead">${escapeHtml(c.lead)}</p>${c.lesson.map(x=>`<p>${escapeHtml(x)}</p>`).join('')}<h3>Slovníček vyšetrovateľa</h3><div class="gloss">${c.terms.map(x=>`<div class="gloss-item"><b>${escapeHtml(x[0])}</b> — ${escapeHtml(x[1])}</div>`).join('')}</div><p class="case-note">V tejto fáze sa učíte nové pojmy. Odpovedajte až po prečítaní textu – cieľom je porozumenie, nie tipovanie.</p></section><section class="section"><div class="eyebrow">KONTROLNÁ OTÁZKA</div><h2>Čo ste sa naučili?</h2>${questionHTML(c.questions[0],0)}</section>`}if(state.phase===1){return `<section class="section"><div class="eyebrow">DÔKAZY POD ČÍSLOM ${c.id}</div><h2>Otvorte a porovnajte 3 dokumenty</h2><p>Každý dokument otvorte kliknutím. Zaznamenajte si, čo je tvrdenie, čo je záznam a kde dokumenty vzájomne nesedia. Na ďalšiu fázu potrebujete preveriť všetky tri.</p><div class="doc-list">${c.evidence.map((e,i)=>{const id=state.current+'-'+i;const open=!!state.evidenceOpen[id];return `<article class="document"><button type="button" class="doc-row" data-action="toggle-evidence" data-doc="${i}" aria-expanded="${open}"><span><b>▤ ${escapeHtml(e[0])}</b><small>${escapeHtml(e[1])}</small></span><span class="${isViewed(i)?'doc-mark':'doc-action'}">${isViewed(i)?'✓ PRESKÚMANÉ':open?'ZAVRIEŤ':'OTVORIŤ +'} </span></button>${open?`<div class="doc-open">${escapeHtml(e[2])}</div>`:''}</article>`}).join('')}</div><p class="case-note">Označenie „preskúmané“ len znamená, že ste dokument otvorili. Správnosť záveru preveria otázky pod ním.</p></section><section class="section"><div class="eyebrow">ANALÝZA DÔKAZOV</div><h2>Oddeľte fakty od domnienok</h2>${questionHTML(c.questions[1],1)}${questionHTML(c.questions[2],2)}</section>`}return `<section class="section"><div class="eyebrow">VYŠETROVACÍ VERDIKT</div><h2>Čo urobí zodpovedné HR?</h2><p class="case-lead">${escapeHtml(c.lead)}</p><p>Vašou úlohou nie je rozhodovať o vine bez ďalšieho preverenia. Navrhnite postup, ktorý chráni práva zamestnancov a zodpovedá dostupným dôkazom.</p>${questionHTML(c.questions[3],3)}</section><section class="section"><div class="eyebrow">POVINNÁ REFLEXIA · 1 BOD ZA VYPRACOVANIE</div><h2>Vyjadrite svoj postup</h2><p>${escapeHtml(c.reflection)}</p><textarea id="reflection" class="reflection" placeholder="Napíšte vlastnými slovami aspoň 100 znakov a 13 slov…" maxlength="2500">${escapeHtml(state.reflections[state.current]||'')}</textarea><div class="reflection-meta"><span id="reflection-count">${(state.reflections[state.current]||'').trim().length} znakov · min. 100 znakov a 13 slov</span><span>Obsah vyučujúci nehodnotí automaticky.</span></div><p class="case-note">Text sa ukladá priebežne. Bod sa udeľuje za splnenie rozsahu, nie za odbornú správnosť textu. Tá môže byť predmetom spätnej väzby od vyučujúceho.</p></section>`}
function phaseRequirements(){let arr=[];let reqQ=state.phase===0?[0]:state.phase===1?[1,2]:[3];for(const qi of reqQ)arr.push([answered(qi),`Uložená odpoveď ${qi+1} / 4`]);if(state.phase===1)arr.push([CASES[state.current].evidence.every((_,i)=>isViewed(i)),'Otvorené všetky 3 dokumenty']);if(state.phase===2)arr.push([reflectionOK(state.reflections[state.current]),'Reflexia aspoň 100 znakov a 13 slov']);arr.push([state.phaseSeconds>=PHASES[state.phase],`Minimálny čas fázy ${fmt(PHASES[state.phase])}`]);return arr}
function lockbox(){const req=phaseRequirements();const ok=req.every(x=>x[0]);return `<div class="timerbox"><div class="eyebrow">Časový zámok</div><div class="timer-big mono" id="stage-countdown">${fmt(PHASES[state.phase]-state.phaseSeconds)}</div><div class="timer-caption">Zostáva do odomknutia fázy. Čas beží len pri otvorenej a aktívnej karte.</div><div class="tiny-meter"><span id="stage-meter" style="width:${Math.min(100,state.phaseSeconds/PHASES[state.phase]*100)}%"></span></div><div class="meta-divider"></div><div class="scorelabel">Celkový aktívny čas:</div><b class="mono" id="stage-total">${fmt(state.totalSeconds)}</b></div><div class="lockbox"><h4>PROTOKOL NA ODOMKNUTIE</h4><ul id="phase-checks" class="checklist">${req.map(x=>`<li class="${x[0]?'ok':''}">${escapeHtml(x[1])}</li>`).join('')}</ul><button id="advance" class="btn primary block lockbtn" data-action="advance" ${ok?'':'disabled'}>${state.phase===2?'UZAVRIEŤ SPIS A POKRAČOVAŤ →':'ODOMKNÚŤ ĎALŠIU FÁZU →'}</button><p class="micro">Aj pri nesprávnej odpovedi môžete pokračovať. Priebeh a skóre zostávajú uložené.</p></div>`}
function renderCase(){const c=CASES[state.current];app.innerHTML=`${topbar()}<div class="shell dashboard">${side()}<main class="content"><header class="case-head" data-symbol="${escapeHtml(c.symbol)}"><div class="eyebrow">SPIS ${escapeHtml(c.id)} / 09 · ${escapeHtml(c.tag)}</div><h1>${escapeHtml(c.title)}</h1><p class="sub">${escapeHtml(c.deck)}</p><div class="head-meta"><span class="chip">3 FÁZY · 10 MIN ÚPLNÉ MINIMUM</span><span class="chip">4 VEDOMOSTNÉ OTÁZKY</span><span class="chip">1 REFLEXIA</span></div></header>${phaseNav()}<div class="stage-grid"><div class="stage-main">${casePhaseContent(c)}${sources()}</div><aside class="stage-side">${lockbox()}<div class="notice">Váš spis: <b>${escapeHtml(state.fullName)}</b> · krúžok <b>${escapeHtml(state.group)}</b><br><br><span class="small">Pri prepnutí na inú kartu sa čas zastaví. Obnovenie stránky vám nevynuluje doteraz získaný čas.</span></div></aside></div>${foot()}</main></div>`;refreshCountdown()}
function renderFinal(){const s=score();const date=state.completedAt?new Date(state.completedAt).toLocaleString('sk-SK',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';app.innerHTML=`${topbar()}<main class="final-container"><div class="certificate"><div class="cap">NORDEN WORKS / VYŠETROVACÍ PROTOKOL ZATVORENÝ</div><h1>MISIA DOKONČENÁ</h1><p style="text-align:center;color:#c8d6dc">THE WHISTLEBLOWER · CERTIFIKÁT ÚČASTI</p><div class="cert-name">${escapeHtml(state.fullName)}</div><p style="text-align:center;color:#afc3cb;margin:0">Krúžok: <strong style="color:#fff">${escapeHtml(state.group)}</strong> · Dátum: ${escapeHtml(date)}</p><div class="cert-grid"><div class="cert-item"><small>CELKOVÉ SKÓRE</small><strong class="grade">${s.total} / ${MAX_POINTS}</strong></div><div class="cert-item"><small>VEDOMOSTNÉ BODY</small><strong>${s.core} / 36</strong></div><div class="cert-item"><small>REFLEXIE – ZA VYPRACOVANIE</small><strong>${s.refl} / 9</strong></div><div class="cert-item"><small>ODOMKNUTÉ SPISY</small><strong>9 / 9</strong></div><div class="cert-item"><small>AKTÍVNY ČAS V HRE</small><strong class="mono">${fmt(state.totalSeconds)}</strong></div><div class="cert-item"><small>STATUS VYŠETROVANIA</small><strong class="grade" style="font-size:17px">UZAVRETÉ ✓</strong></div></div><p style="text-align:center;color:#e8cb9b">Záverečný odkaz: práva pracovníkov nie sú detail, ale základ dôveryhodnej organizácie.</p><div class="send"><h3>📷 POVINNÉ ODOVZDANIE SCREENSHOTU</h3><p><b>Urobte screenshot celej tejto záverečnej obrazovky tak, aby na ňom bolo jasne vidieť vaše meno a priezvisko, číslo krúžku a celkové skóre.</b></p><p>Screenshot pošlite <b>Ing. Jaroslavovi Belásovi, PhD.</b> v <b>súkromnej správe prostredníctvom MS Teams</b>. Bude slúžiť ako podklad k prezenčnej listine, že ste sa seminára zúčastnili a pracovali na zadaní.</p><p>Ak sa celá obrazovka nezmestí na jeden záber, zmenšite zobrazenie prehliadača (napr. Ctrl + mínus), aby bolo vidieť všetky požadované údaje.</p></div><p class="autoeval">Upozornenie: vedomostné body sa počítajú za prvú uloženú odpoveď. Reflexie sú bodované za vypracovanie, nie za kvalitu. Screenshot sám osebe nezaručuje overenie fyzickej prítomnosti.</p></div><div class="finish-actions hide-print"><button class="btn secondary" type="button" onclick="window.print()">Vytlačiť / uložiť výslednú stránku do PDF</button><button class="btn ghost" type="button" data-action="reset">Začať úplne odznova</button></div><div class="shell">${foot()}</div></main>`}
function render(){if(!state.fullName)return renderIntro();if(state.current>=CASES.length)return renderFinal();renderCase()}
function checkedSelected(qi){const q=CASES[state.current].questions[qi];if(q.type==='number'){const x=app.querySelector(`[data-draft-number="${qi}"]`);return x&&x.value.trim()!==''?[x.value.trim()]:[]}return [...app.querySelectorAll(`input[data-draft="${qi}"]:checked`)].map(x=>x.value)}
function normalizedNum(v){const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:null}
function grade(q,selected){if(q.type==='number')return selected.length===1 && q.answer.some(v=>normalizedNum(v)===normalizedNum(selected[0]));return selected.length===q.answer.length && selected.every(v=>q.answer.includes(v))}
function refreshCountdown(){if(!state.fullName||state.current>=CASES.length)return;const el=document.getElementById('stage-countdown');const global=document.getElementById('global-clock');const total=document.getElementById('stage-total');const meter=document.getElementById('stage-meter');if(el)el.textContent=state.phaseSeconds>=PHASES[state.phase]?'ODOMKNUTÉ':fmt(PHASES[state.phase]-state.phaseSeconds);if(global)global.textContent=fmt(state.totalSeconds);if(total)total.textContent=fmt(state.totalSeconds);if(meter)meter.style.width=Math.min(100,state.phaseSeconds/PHASES[state.phase]*100)+'%';const requirements=phaseRequirements();const ul=document.getElementById('phase-checks');if(ul){[...ul.children].forEach((li,i)=>{li.className=requirements[i][0]?'ok':''})}const advance=document.getElementById('advance');if(advance)advance.disabled=!requirements.every(x=>x[0]);}
function reset(){if(confirm('Naozaj chcete odstrániť celý uložený postup a skóre a začať odznova?')){state=fresh();save();render();window.scrollTo(0,0)}}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(action==='reset'){reset();return;}if(action==='toggle-evidence'){const i=Number(b.dataset.doc),id=state.current+'-'+i;state.evidenceOpen[id]=!state.evidenceOpen[id];state.viewed[id]=true;save();renderCase();return;}if(action==='submit-answer'){const qi=Number(b.dataset.qi);if(answered(qi))return;const q=CASES[state.current].questions[qi];const selected=checkedSelected(qi);if(selected.length===0){alert('Najprv vyberte alebo zadajte odpoveď.');return;}state.answers[key(qi)]={selected,correct:grade(q,selected)};delete state.drafts[key(qi)];save();renderCase();return;}if(action==='advance'){if(!phaseRequirements().every(x=>x[0]))return;const current=CASES[state.current];if(state.phase<2){state.phase++;}else{state.earnedTokens.push(current.token);state.current++;state.phase=0;if(state.current===CASES.length){state.completedAt=new Date().toISOString();}}state.phaseSeconds=0;state.evidenceOpen={};save();render();window.scrollTo(0,0);return;}});
app.addEventListener('change',e=>{const input=e.target;if(input.dataset.draft!==undefined){const qi=Number(input.dataset.draft);state.drafts[key(qi)]=checkedSelected(qi);save();}});
app.addEventListener('input',e=>{const input=e.target;if(input.id==='reflection'){state.reflections[state.current]=input.value;save();const label=document.getElementById('reflection-count');if(label)label.textContent=input.value.trim().length+' znakov · min. 100 znakov a 13 slov';refreshCountdown();}if(input.dataset.draftNumber!==undefined){const qi=Number(input.dataset.draftNumber);state.drafts[key(qi)]=input.value!==''?[input.value]:[];save();}});
let lastTick=performance.now();let savedLast=performance.now();setInterval(()=>{const now=performance.now();const delta=Math.max(0,Math.min(1.2,(now-lastTick)/1000));lastTick=now;if(!state.fullName||state.current>=CASES.length)return;if(document.visibilityState==='visible'&&document.hasFocus()){state.phaseSeconds+=delta;state.totalSeconds+=delta;refreshCountdown();}if(now-savedLast>4000){save();savedLast=now}},1000);
document.addEventListener('visibilitychange',()=>{lastTick=performance.now();save()});window.addEventListener('beforeunload',()=>save());
render();
</script>
